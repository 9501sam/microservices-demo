apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: online-boutique
spec:
  ports:
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: http-query
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.56
          args:
            - "--log-level=debug"
            - "--collector.otlp.enabled=true"  # 啟用 OTLP gRPC
          ports:
            - name: grpc-otlp
              containerPort: 4317
            - name: http-query
              containerPort: 16686

